version: '3.8'

services:
  # PostgreSQL with PostGIS extension for Geospatial queries
  postgres:
    image: postgis/postgis:16-3.4
    container_name: aegis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis_user
      POSTGRES_PASSWORD: aegis_secure_password
      POSTGRES_DB: aegis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/migrations/002_indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_user -d aegis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # AEGIS Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://aegis_user:aegis_secure_password@postgres:5432/aegis_db
      DEV_MOCK_AUTH: "true"
      SMS_PROVIDER: mock
      PUSH_PROVIDER: mock
      MAPS_PROVIDER: osm
      ROUTING_PROVIDER: osrm
      OSRM_BASE_URL: https://router.project-osrm.org
      LOCATION_PUBLIC_BASE_URL: http://localhost:5000/live
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  postgres_data:
    name: aegis_postgres_data
