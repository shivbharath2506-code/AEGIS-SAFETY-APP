<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEGIS — Live Location Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --bg-card: rgba(16, 24, 44, 0.9);
      --border-color: rgba(255, 255, 255, 0.1);
      --cyan: #06b6d4;
      --primary: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(10, 15, 29, 0.95);
      border-bottom: 1px solid var(--border-color);
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
    }
    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .map-container {
      flex: 1;
      position: relative;
    }
    #track-map {
      width: 100%;
      height: 100%;
    }
    .floating-info {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 1.5rem;
      backdrop-filter: blur(12px);
      max-width: 90vw;
    }
    .btn-call {
      background: #ef4444;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <i class="fa-solid fa-shield-halved" style="color: #ef4444;"></i>
      <span>AEGIS Live Location Tracker</span>
    </div>
    <div class="status-badge" id="session-badge">
      <span style="width:7px; height:7px; background:#10b981; border-radius:50%; animation: pulse 1.5s infinite;"></span>
      <span>ACTIVE ENCRYPTED BROADCAST</span>
    </div>
  </header>

  <div class="map-container">
    <div id="track-map"></div>

    <div class="floating-info" id="info-box">
      <div>
        <div style="font-weight: 700; font-size: 0.95rem;" id="user-heading">Citizen Location Sharing</div>
        <div style="font-size: 0.78rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace;" id="coords-text">Fetching GPS...</div>
      </div>
      <a href="tel:112" class="btn-call">
        <i class="fa-solid fa-phone"></i>
        <span>Call Emergency (112)</span>
      </a>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    let map, marker;

    const defaultLat = 13.0827;
    const defaultLng = 80.2707;

    map = L.map('track-map', { attributionControl: false }).setView([defaultLat, defaultLng], 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    setTimeout(() => { if (map) map.invalidateSize(); }, 300);
    window.addEventListener('resize', () => { if (map) map.invalidateSize(); });

    const pulseIcon = L.divIcon({
      html: '<div style="width:24px; height:24px; background:#06b6d4; border:3px solid #fff; border-radius:50%; box-shadow:0 0 20px #06b6d4;"></div>',
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

    marker = L.marker([defaultLat, defaultLng], { icon: pulseIcon }).addTo(map);

    async function pollLocation() {
      if (!token) {
        document.getElementById('coords-text').textContent = 'Invalid or missing security token.';
        return;
      }

      try {
        const res = await fetch(`/api/v1/location-sessions/view?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (res.ok && data.data) {
          const lat = data.data.currentLatitude || defaultLat;
          const lng = data.data.currentLongitude || defaultLng;
          marker.setLatLng([lat, lng]);
          map.panTo([lat, lng]);
          document.getElementById('coords-text').textContent = `Live GPS: ${lat.toFixed(4)}, ${lng.toFixed(4)} &bull; Chennai Grid`;
        }
      } catch (e) {
        console.warn('Poll error:', e);
      }
    }

    pollLocation();
    setInterval(pollLocation, 5000);
  </script>
</body>
</html>
